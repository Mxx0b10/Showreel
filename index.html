<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Showreel Studio</title>
<meta name="description" content="Create showreel videos of your design work with layouts and transitions. No login, runs in your browser." />
<meta name="theme-color" content="#0f0f10" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- Open Graph / share preview -->
<meta property="og:title" content="Showreel Studio" />
<meta property="og:description" content="Create showreel videos of your design work with layouts and transitions." />
<meta property="og:type" content="website" />
<meta property="og:image" content="icon-512.png" />
<script>
  // Theme: 'light' | 'dark' | 'system' (default). Applied before paint.
  window.applyTheme = function(mode){
    var mq = matchMedia('(prefers-color-scheme: light)');
    var t = mode === 'system' ? (mq.matches ? 'light' : 'dark') : mode;
    document.documentElement.dataset.theme = t;
    document.documentElement.dataset.themeMode = mode;
  };
  (function(){
    var m; try{ m = localStorage.getItem('showreel-theme'); }catch(e){}
    applyTheme(m === 'light' || m === 'dark' ? m : 'system');
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){
      if(document.documentElement.dataset.themeMode === 'system') applyTheme('system');
    });
  })();
</script>
<style>
  :root{
    --bg:#0f0f10;
    --panel:#161618;
    --panel-2:#1c1c1f;
    --hover:#222226;
    --line:#2a2a2e;
    --line-2:#37373d;
    --text:#ececee;
    --muted:#8a8a92;
    --accent:#ececee;
    --accent-hover:#ffffff;
    --on-accent:#0f0f10;
    --stage:#0a0a0b;
    --thumb-bg:#000;
    --knob:#ffffff;
    --scroll:#2a2a2e;
    --shadow:0 8px 28px rgba(0,0,0,.45);
    --card:#18181b;
    --field:#232327;
    --field-hover:#29292e;
    --field-fill:#35353c;
    --chip:#3a3a41;
    --chip-shadow:0 1px 2px rgba(0,0,0,.4);
    --ok:#22c55e;
    --err:#ef4444;
    --r:10px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f6f6f4;
    --panel:#ffffff;
    --panel-2:#f4f4f2;
    --hover:#ececea;
    --line:#e6e6e2;
    --line-2:#d4d4cf;
    --text:#1a1a1c;
    --muted:#6b6b72;
    --accent:#1a1a1c;
    --accent-hover:#000000;
    --on-accent:#ffffff;
    --stage:#ecece9;
    --thumb-bg:#e4e4e0;
    --knob:#ffffff;
    --scroll:#d4d4cf;
    --shadow:0 8px 24px rgba(20,20,30,.12);
    --card:#ffffff;
    --field:#f2f2f0;
    --field-hover:#ebebe8;
    --field-fill:#dfdfdb;
    --chip:#ffffff;
    --chip-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06);
    --ok:#16a34a;
    --err:#dc2626;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:280px 1fr 300px;grid-template-rows:52px 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px;font-size:13px}
  header .brand .logo{width:18px;height:18px;flex-shrink:0;display:block}
  header .actions{display:flex;gap:6px}
  .btn{background:transparent;border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s;font-size:12px}
  .btn:hover{border-color:var(--line-2);background:var(--hover)}
  .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.ghost{border-color:transparent}
  .btn.ghost:hover{border-color:var(--line)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .iconBtn{padding:6px 8px}
  .iconBtn .ic{width:16px;height:16px;display:block;color:var(--muted)}
  .iconBtn:hover .ic{color:var(--text)}
  .iconBtn.muted .ic{color:var(--muted)}
  .panel{background:var(--panel);overflow:auto}
  .panel.left{border-right:1px solid var(--line);padding:14px}
  .panel.right{border-left:1px solid var(--line);padding:6px 16px 20px}
  .panel::-webkit-scrollbar{width:8px;height:8px}
  .panel::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;background:var(--stage)}
  .canvasWrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  canvas{display:block;background:var(--thumb-bg);box-shadow:var(--shadow)}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:120px;text-align:right;font-size:11px}
  h3{margin:0 0 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .group{margin-bottom:20px}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .row label{flex:1;color:var(--muted);font-size:12px}
  .row input[type=text],.row input[type=number],.row select{
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--text);width:100%;outline:none;font-size:12px
  }
  .row input[type=number]{max-width:90px;text-align:right;font-variant-numeric:tabular-nums}
  .row input:focus{border-color:var(--line-2)}
  .row input[type=checkbox]{accent-color:var(--text)}
  .effects{display:flex;flex-wrap:wrap;gap:4px}
  .fx{padding:5px 9px;background:var(--field);border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:11px;color:var(--muted);transition:.12s}
  .fx:hover{border-color:var(--line-2);color:var(--text)}
  .fx.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);border-radius:10px;padding:18px 12px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel-2);transition:.12s;min-height:96px}
  .drop:hover{border-color:var(--line-2);color:var(--text);background:var(--hover)}
  .drop.drag{border-color:var(--text);color:var(--text);background:var(--hover)}
  .drop .drop-icon{width:24px;height:24px;border-radius:6px;border:1.5px dashed currentColor;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;opacity:.7}
  .drop .drop-title{font-size:12px;font-weight:500;color:var(--text);line-height:1.3}
  .drop .drop-sub{font-size:10px;color:var(--muted);letter-spacing:.02em}
  .clips{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .clip{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px;cursor:grab}
  .clip:active{cursor:grabbing}
  .clip.drag{opacity:.4}
  .clip .thumb{width:50px;height:32px;border-radius:4px;object-fit:cover;background:var(--thumb-bg)}
  .clip .meta{flex:1;min-width:0}
  .clip .meta .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .clip .meta .nm .demoBadge{font-size:9px;font-weight:600;letter-spacing:.04em;color:var(--muted);background:var(--hover);border:1px solid var(--line);padding:1px 5px;border-radius:4px;flex-shrink:0;text-transform:uppercase}
  .clip .meta .sm{font-size:10px;color:var(--muted)}
  .clip .x{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
  .clip .x:hover{color:var(--err)}
  .mini-select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--text);outline:none;font-size:11px;cursor:pointer}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .hd h3{margin:0}
  .projs{display:flex;flex-direction:column;gap:4px}
  .proj{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px}
  .proj .thumb{width:50px;height:32px;border-radius:4px;object-fit:cover;background:var(--thumb-bg);flex-shrink:0}
  .proj .meta{flex:1;min-width:0}
  .proj .meta .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj .meta .sm{font-size:10px;color:var(--muted)}
  .proj .acts{display:flex;align-items:center;gap:2px;flex-shrink:0}
  .proj .open{padding:3px 8px;font-size:11px}
  .proj .x{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
  .proj .x:hover{color:var(--err)}
  .hint{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.5}
  .toggle{display:flex;background:var(--field);border-radius:7px;padding:2px;gap:2px}
  .toggle button{flex:1;background:transparent;border:0;color:var(--muted);padding:4px 6px;border-radius:5px;cursor:pointer;font-size:11px;transition:color .12s,background .12s}
  .toggle button:hover{color:var(--text)}
  .toggle button.sel{background:var(--chip);color:var(--text);box-shadow:var(--chip-shadow)}
  .status{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:8px;display:none;align-items:center;gap:10px;font-size:12px}
  .status.show{display:flex}
  .inspireBtn{position:fixed;left:20px;bottom:20px;z-index:50;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:999px;padding:9px 16px 9px 12px;font:600 12px/1 -apple-system,"Inter",sans-serif;letter-spacing:.01em;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease}
  .inspireBtn:hover{transform:translateY(-1px)}
  .inspireBtn:active{transform:translateY(0)}
  .inspireBtn .ib-icon{width:16px;height:16px;display:block}
  .inspireBtn.spin .ib-icon{animation:ibSpin 600ms ease-out}
  @keyframes ibSpin{from{transform:rotate(0)} to{transform:rotate(360deg)}}
  .spinner{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--text);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .kbd{font-family:ui-monospace,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:1px 4px;font-size:10px;color:var(--muted)}
  details{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-top:6px}
  details summary{cursor:pointer;color:var(--muted);font-size:11px;outline:none}
  .unit{color:var(--muted);font-size:11px;margin-left:4px}
  .field{display:flex;align-items:center;gap:4px}
  /* right panel — inspector cards */
  .panel.right{background:var(--bg);padding:12px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .sec h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:12px;letter-spacing:0;text-transform:none;color:var(--text);font-weight:600}
  .sec h3 .cur{font-weight:500;color:var(--muted);font-size:11px}
  .prop{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;min-height:28px;margin-top:6px}
  .prop[hidden]{display:none}
  .prop > label{color:var(--muted);font-size:12px}
  .prop-end{display:flex;justify-content:flex-end}
  .prop .toggle button{padding:5px 4px;white-space:nowrap}
  /* scrub field: a filled bar you drag, value inside */
  .scrub{position:relative;height:28px;border-radius:7px;background:var(--field);overflow:hidden;display:flex;align-items:center;gap:7px;padding:0 9px;font-size:12px;font-variant-numeric:tabular-nums;transition:background .12s}
  .scrub::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--field-fill)}
  .scrub::after{content:"";position:absolute;top:6px;bottom:6px;left:calc(var(--p,0%) - 1px);width:2px;border-radius:2px;background:var(--text);opacity:0;transition:opacity .12s}
  .scrub:hover{background:var(--field-hover)}
  .scrub:hover::after,.scrub:focus-within::after{opacity:.55}
  .scrub:focus-within{box-shadow:0 0 0 1.5px var(--line-2)}
  .scrub > span{position:relative;z-index:1;pointer-events:none}
  .sc-ic{display:flex;color:var(--muted)}
  .sc-ic svg{width:14px;height:14px}
  .sc-val{flex:1;color:var(--text)}
  .sc-unit{color:var(--muted);font-size:11px}
  .scrub input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:2}
  /* background swatches */
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .sw{position:relative;aspect-ratio:1;border-radius:8px;border:0;padding:0;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(127,127,127,.28);transition:transform .12s}
  .sw:hover{transform:scale(1.06)}
  .sw.sel{box-shadow:inset 0 0 0 1px rgba(127,127,127,.28),0 0 0 2px var(--card),0 0 0 3.5px var(--accent)}
  .sw .blurimg{position:absolute;inset:-6px;background:var(--field-fill) center/cover;filter:blur(4px) saturate(1.2)}
  .sw .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.02em}
  .sw.custom{background:conic-gradient(from 0deg,#f43f5e,#f59e0b,#84cc16,#06b6d4,#6366f1,#d946ef,#f43f5e)}
  .sw.custom .dot{position:absolute;inset:7px;border-radius:5px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
  .sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
  /* theme switch */
  .themeSeg{display:flex;background:var(--field);border-radius:8px;padding:2px;gap:2px;margin-right:4px}
  .themeSeg button{width:28px;height:24px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
  .themeSeg button:hover{color:var(--text)}
  .themeSeg button.sel{background:var(--chip);color:var(--text);box-shadow:var(--chip-shadow)}
  .themeSeg svg{width:14px;height:14px}
  /* timeline */
  .timeline{display:flex;align-items:center;gap:10px;width:min(860px,94%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;box-shadow:var(--shadow)}
  .tl-play{flex-shrink:0;width:36px;height:36px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;transition:transform .12s}
  .tl-play:hover{transform:scale(1.05)}
  .tl-play svg{width:15px;height:15px}
  .tl-play .i-pause,.tl-play.playing .i-play{display:none}
  .tl-play.playing .i-pause{display:block}
  .tl-time{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
  .tl-time.muted{color:var(--muted)}
  .tl-track{position:relative;flex:1;height:38px;border-radius:8px;background:var(--field);overflow:hidden}
  .tl-segs{position:absolute;inset:3px;display:flex;gap:2px}
  .tl-seg{flex:1;min-width:0;border-radius:5px;background:var(--field-fill) center/cover no-repeat}
  .tl-dim{position:absolute;top:0;bottom:0;right:0;left:var(--p,0%);background:color-mix(in srgb,var(--card) 62%,transparent);pointer-events:none}
  .tl-head{position:absolute;top:0;bottom:0;left:var(--p,0%);width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--card) 60%,transparent)}
  .tl-head i{position:absolute;top:-1px;left:50%;width:10px;height:6px;transform:translateX(-50%);background:var(--accent);border-radius:0 0 3px 3px}
  .tl-track input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .switch-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:12px;cursor:pointer}
  .switch{-webkit-appearance:none;appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;margin:0}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
  .switch:checked{background:var(--ok)}
  .switch:checked::after{transform:translateX(12px)}
  .ex-summary{margin-top:10px;padding:9px 10px;background:var(--field);border-radius:8px;font-size:11px;color:var(--muted);line-height:1.55}
  .ex-summary b{color:var(--text);font-weight:600}
  .btn.big{width:100%;justify-content:center;margin-top:12px;padding:10px 12px;font-size:13px;font-weight:600;border-radius:9px}
  .effects{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .fx{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 6px;border-radius:7px}
  .fx:hover{background:var(--field-hover)}

  @media (max-width: 1100px){.app{grid-template-columns:240px 1fr 280px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="7" width="17" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
        <rect x="5" y="4.5" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="8" y="4.5" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="11" y="4.5" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="14" y="4.5" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="17" y="4.5" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="5" y="17.9" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="8" y="17.9" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="11" y="17.9" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="14" y="17.9" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <rect x="17" y="17.9" width="2" height="1.6" rx=".4" fill="currentColor"/>
        <polygon points="10,9.5 10,14.5 15,12" fill="currentColor"/>
      </svg>
      Showreel Studio
    </div>
    <div class="actions">
      <div class="themeSeg" id="themeSeg" role="radiogroup" aria-label="Theme">
        <button data-v="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.8" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M3.6 12.4l1-1M11.4 4.6l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button data-v="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 16 16" fill="none"><path d="M13.2 9.6A5.4 5.4 0 0 1 6.4 2.8a5.4 5.4 0 1 0 6.8 6.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
        <button data-v="system" title="Match system" aria-label="Match system theme"><svg viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 13.5h4M8 11v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </div>
      <button class="btn ghost iconBtn" id="btnSound" title="Toggle sound" aria-label="Toggle sound">
        <svg class="ic ic-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 9v6h3.5L13 19V5L8.5 9H5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M16 9.5c1 .7 1.5 1.6 1.5 2.5s-.5 1.8-1.5 2.5M18 7c2 1.4 3 3 3 5s-1 3.6-3 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="ic ic-off" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none">
          <path d="M5 9v6h3.5L13 19V5L8.5 9H5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M17 9l5 5M22 9l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="btn ghost" id="btnReset">Reset</button>

<button id="inspireBtn" class="inspireBtn" title="Randomize layout, effect, timing, and style">

    <circle cx="12" cy="12" r="3.4" fill="currentColor"/>

<script>
/* ----------------------------- state ----------------------------- */
const state = {
  clips: [],
  mode: 'custom',
  templateId: 'single',
  effectId: 'fade',
  aspect: '16:9',
  bgMode: 'dark',
  quality: 'fhd',
  fit: 'cover',
  paddingPct: 6,
  radiusPct: 2,
  shadowPct: 30,
  shadowBlur: 50,
  bgId: 'ink',
  bgCustom: '#2b2d42',
  gapPct: 1.5,
  perDurMs: 2000,
  transMs: 400,
  loop: true,
  fps: 60,
  exFormat: 'mp4',
  exQuality: 'high',
  gifRes: 480,
  playing: false,
  t0: 0,
  pausedMs: 0,
  totalMs: 0,
};

/* ----------------------------- helpers ----------------------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const easeOutCubic = t => 1 - Math.pow(1-t,3);
const easeInOutCubic = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOutBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const easeOutQuint = t => 1 - Math.pow(1-t, 5);
const easeInOutQuint = t => t<.5 ? 16*t*t*t*t*t : 1 - Math.pow(-2*t+2, 5)/2;
const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10*t);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* Snap-and-hold progress for continuous layouts.
   Each clip gets `perDurMs` of screen time:
     - holds in focus for (perDurMs - transMs) ms
     - then eases over `transMs` ms to the next clip's focus position
   Returns a float where integer = clip index in focus, fractional = travelling. */
function snapProgress(tMs){
  const slotMs = state.perDurMs;
  const moveMs = clamp(state.transMs, 0, slotMs * 0.9);
  const holdMs = slotMs - moveMs;
  const slotIdx = Math.floor(tMs/slotMs);
  const inSlot = tMs - slotIdx*slotMs;
  let frac;
  if(inSlot < holdMs || moveMs <= 0) frac = 0;
  else frac = easeInOutCubic(clamp((inSlot - holdMs)/moveMs, 0, 1));
  return slotIdx + frac;
}
const uuid = ()=>Math.random().toString(36).slice(2,9);
const fmtMs = ms => { const s = Math.max(0, ms)/1000; const m = Math.floor(s/60); return `${m}:${(s - m*60).toFixed(1).padStart(4,'0')}`; };

function setStatus(msg, show=true){
  const el = $('#status'); $('#statusText').textContent = msg||'';
  el.classList.toggle('show', !!show);
}
/* Backgrounds: solid, gradient, blurred current shot, or a custom colour.
   `tone` drives letterbox fills and placeholder colours (state.bgMode). */
const BACKGROUNDS = {
  ink:      {name:'Ink',      type:'solid', colors:['#0a0a0b'], tone:'dark'},
  graphite: {name:'Graphite', type:'solid', colors:['#1f2024'], tone:'dark'},
  paper:    {name:'Paper',    type:'solid', colors:['#f5f5f3'], tone:'light'},
  white:    {name:'White',    type:'solid', colors:['#ffffff'], tone:'light'},
  sand:     {name:'Sand',     type:'solid', colors:['#ede4d3'], tone:'light'},
  blur:     {name:'Blur',     type:'blur',  colors:['#111'],    tone:'dark'},
  dusk:     {name:'Dusk',     type:'gradient', colors:['#1e1b4b','#6d28d9','#f472b6'], tone:'dark'},
  ocean:    {name:'Ocean',    type:'gradient', colors:['#0b1220','#0e7490','#5eead4'], tone:'dark'},
  ember:    {name:'Ember',    type:'gradient', colors:['#1c0a00','#c2410c','#fbbf24'], tone:'dark'},
  mint:     {name:'Mint',     type:'gradient', colors:['#ecfdf5','#a7f3d0','#bae6fd'], tone:'light'},
  peach:    {name:'Peach',    type:'gradient', colors:['#fff7ed','#fecaca','#f9a8d4'], tone:'light'},
  custom:   {name:'Custom',   type:'solid', colors:null, tone:null},
};
function hexTone(hex){
  const n = parseInt(hex.slice(1), 16), r = n>>16 & 255, g = n>>8 & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? 'light' : 'dark';
}
function currentBg(){
  const b = BACKGROUNDS[state.bgId] || BACKGROUNDS.ink;
  if(state.bgId === 'custom') return {...b, colors:[state.bgCustom], tone:hexTone(state.bgCustom)};
  return b;
}
// Cheap blur: draw the shot cover-fit into a tiny blurred canvas, then upscale.
const blurCache = new WeakMap();
function blurredShot(clip, W, H){
  if(!clip || !clip.el) return null;
  const sw = 96, sh = Math.max(1, Math.round(96*H/W)), key = sw+'x'+sh;
  const isVideo = clip.type === 'video';
  let m = blurCache.get(clip.el);
  if(!isVideo && m && m[key]) return m[key];
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  const g = c.getContext('2d');
  g.filter = 'blur(3px) saturate(1.25)';
  const ar = clip.w/clip.h, br = sw/sh, pad = 8;
  let dw, dh;
  if(ar > br){ dh = sh + pad*2; dw = dh*ar; } else { dw = sw + pad*2; dh = dw/ar; }
  try{ g.drawImage(pickSource(clip, dw, dh), (sw-dw)/2, (sh-dh)/2, dw, dh); }catch(e){}
  if(!isVideo){ m = m || {}; m[key] = c; blurCache.set(clip.el, m); }
  return c;
}
function drawBackground(ctx, W, H, tMs){
  const b = currentBg();
  state.bgMode = b.tone;
  if(b.type === 'gradient'){
    const g = ctx.createLinearGradient(0, 0, W, H);
    b.colors.forEach((c,i) => g.addColorStop(i/(b.colors.length-1), c));
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    return;
  }
  ctx.fillStyle = b.colors[0];
  ctx.fillRect(0,0,W,H);
  if(b.type !== 'blur' || !state.clips.length) return;
  // Blur follows the clip on screen and cross-fades into the next one.
  const n = state.clips.length, dur = state.perDurMs;
  const slot = Math.floor(tMs / dur), inSlot = tMs - slot*dur;
  const tr = clamp(state.transMs, 0, dur/2);
  const cur = blurredShot(state.clips[slot % n], W, H);
  ctx.save();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if(cur) ctx.drawImage(cur, 0, 0, W, H);
  if(tr > 0 && inSlot > dur - tr){
    const nxt = blurredShot(state.clips[(slot+1) % n], W, H);
    if(nxt){ ctx.globalAlpha = (inSlot - (dur - tr)) / tr; ctx.drawImage(nxt, 0, 0, W, H); }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function fgColor(){ return state.bgMode==='dark' ? '#ececee' : '#0f0f10'; }

/* ----------------------------- audio (UI sounds) -----------------------------
   Synthesized via Web Audio API so we don't ship any audio files. Sounds
   are short, low-volume, and only play on real user clicks (e.isTrusted),
   so programmatic UI updates never make noise. */
const audio = {
  ctx: null,
  muted: localStorage.getItem('showreel.muted') === '1',
  ensure(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      this.ctx = new AC();
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  setMuted(m){
    this.muted = !!m;
    localStorage.setItem('showreel.muted', m ? '1' : '0');
    const btn = document.getElementById('btnSound');
    if(btn){
      btn.classList.toggle('muted', m);
      const on = btn.querySelector('.ic-on'), off = btn.querySelector('.ic-off');
      if(on) on.style.display = m ? 'none' : 'block';
      if(off) off.style.display = m ? 'block' : 'none';
    }
  },
  // Short envelope-shaped tone.
  tone(freq, dur=0.05, type='sine', peak=0.05, attack=0.005){
    if(this.muted || !this.ensure()) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t+dur+0.02);
  },
  play(name){
    if(this.muted || !this.ensure()) return;
    const t = this.ctx.currentTime;
    if(name === 'click'){
      this.tone(880, 0.045, 'triangle', 0.05);
    } else if(name === 'tick'){
      this.tone(1500, 0.025, 'square', 0.025);
    } else if(name === 'pop'){
      // small two-note chirp
      this.tone(620, 0.06, 'sine', 0.05);
      setTimeout(() => this.tone(880, 0.05, 'sine', 0.04), 30);
    } else if(name === 'sweep'){
      // rising sweep for special actions (Inspire, Export)
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(1320, t+0.28);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.06, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.30);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); osc.stop(t+0.32);
      // soft harmonic
      this.tone(660, 0.18, 'triangle', 0.025);
    } else if(name === 'success'){
      // 3-note ascending arpeggio (export complete)
      this.tone(523, 0.10, 'triangle', 0.05);
      setTimeout(() => this.tone(659, 0.10, 'triangle', 0.05), 90);
      setTimeout(() => this.tone(784, 0.18, 'triangle', 0.05), 180);
    }
  },
};

// Map a clicked element to a sound name. Returns null when no sound applies.
function _classifyClickForSound(target){
  if(!target || !target.closest) return null;
  if(target.closest('#btnSound')) return null; // toggling mute itself shouldn't beep
  if(target.closest('#inspireBtn')) return 'sweep';
  if(target.closest('#btnExport')) return 'sweep';
  if(target.closest('.fx')) return 'tick';
  if(target.closest('.toggle button')) return 'tick';
  if(target.closest('.clip .x')) return 'tick';
  if(target.closest('.btn')) return 'click';
  return null;
}

// Single global click listener — only acts on trusted (real user) clicks.
document.addEventListener('click', (e) => {
  if(!e.isTrusted) return;
  const sound = _classifyClickForSound(e.target);
  if(sound) audio.play(sound);
}, true);

/* ----------------------------- canvas ----------------------------- */
const cv = $('#cv');
const ctx = cv.getContext('2d');

function applyAspect(){
  // Resolution presets — buffer matches export resolution.
  const sizes = {
    hd:  {'16:9':[1280,720],  '1:1':[1080,1080],'4:5':[720,900],   '9:16':[720,1280] },
    fhd: {'16:9':[1920,1080], '1:1':[1440,1440],'4:5':[1080,1350], '9:16':[1080,1920]},
    qhd: {'16:9':[2560,1440], '1:1':[1920,1920],'4:5':[1440,1800], '9:16':[1440,2560]},
    uhd: {'16:9':[3840,2160], '1:1':[2880,2880],'4:5':[2160,2700], '9:16':[2160,3840]},
  };
  const [w,h] = sizes[state.quality][state.aspect];
  cv.width = w; cv.height = h;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  // Display constrained to viewport but buffer is full-res.
  const maxW = Math.min(window.innerWidth - 640, 1100);
  const maxH = window.innerHeight - 220;
  const r = Math.min(maxW/w, maxH/h, 1);
  cv.style.width = (w*r)+'px';
  cv.style.height = (h*r)+'px';
  // Rebuild scaled-image cache for new target resolution.
  rebuildScaledCache();
}

/* Multi-step downscale cache.
   Browsers downscale in a single drawImage pass which can soften details on
   big source images. We pre-bake a pyramid (halving each step) so drawClip
   can start from a source that is at most 2× the target — preserves detail. */
const scaledCache = new WeakMap(); // clip.el -> [{w,h,canvas}]
function buildPyramid(srcEl, srcW, srcH){
  const levels = [];
  // Largest level == original (we keep a reference, not a copy)
  levels.push({w:srcW, h:srcH, el:srcEl});
  let cw = srcW, ch = srcH;
  // Halve until small enough; cap to 10 levels to bound memory.
  for(let i=0;i<10 && Math.max(cw,ch) > 64; i++){
    const nw = Math.max(1, Math.round(cw/2));
    const nh = Math.max(1, Math.round(ch/2));
    const c = document.createElement('canvas');
    c.width = nw; c.height = nh;
    const cx = c.getContext('2d');
    cx.imageSmoothingEnabled = true;
    cx.imageSmoothingQuality = 'high';
    // Step down from the previous level for cleanest result.
    cx.drawImage(levels[levels.length-1].el, 0, 0, nw, nh);
    levels.push({w:nw, h:nh, el:c});
    cw = nw; ch = nh;
  }
  return levels;
}
function rebuildScaledCache(){
  for(const clip of state.clips){
    if(clip.type === 'image' && !scaledCache.has(clip.el)){
      scaledCache.set(clip.el, buildPyramid(clip.el, clip.w, clip.h));
    }
  }
}
function pickSource(clip, targetW, targetH){
  if(clip.type !== 'image') return clip.el;
  const pyr = scaledCache.get(clip.el);
  if(!pyr) return clip.el;
  // Pick smallest level still ≥ target on both axes (keeps source ≥ target,
  // ≤ 2× target — single drawImage call now does a clean shrink).
  let best = pyr[0];
  for(const lv of pyr){
    if(lv.w >= targetW && lv.h >= targetH) best = lv;
    else break;
  }
  return best.el;
}

/* ----------------------------- layouts ----------------------------- */
/* Layouts define tiles in normalized [0..1] coordinates relative to the
   padded inner area. `project` converts those into canvas-space rects,
   respecting state.paddingPct (outer margin) and state.gapPct (between tiles). */
function project(W, H, normRects){
  const p = state.paddingPct / 100;
  const x0 = W*p, y0 = H*p;
  const sx = W*(1-2*p), sy = H*(1-2*p);
  return normRects.map(([nx,ny,nw,nh]) => [
    x0 + nx*sx,
    y0 + ny*sy,
    nw*sx,
    nh*sy
  ]);
}
// Returns normalized gap as fraction of inner area (so it stays a consistent
// visual size relative to the padded box).
function gapN(W, H){
  return state.gapPct / 100;
}
// Inset for continuous layouts (no outer padding subtraction needed — they
// position tiles in canvas space directly).
function inset(W, H){
  const p = state.paddingPct / 100;
  return { x: W*p, y: H*p, w: W*(1-2*p), h: H*(1-2*p) };
}

/*
  Each effect = how a clip enters/holds/exits within its slot.
  fn(ctx, clip, frame, localT, holdT) where:
    frame = [x,y,w,h]
    localT 0..1 includes the transition + hold + transition normalized
*/
const effects = {
  none: { name:'None', fn(ctx,clip,frame,t,phase){ drawClip(ctx,clip,frame,1,1,0,0); } },
  fade: { name:'Fade', fn(ctx,clip,frame,t,phase){
    const a = phase==='in' ? t : phase==='out' ? 1-t : 1;
    drawClip(ctx,clip,frame,1,a,0,0);
  }},
  zoomIn: { name:'Zoom in', fn(ctx,clip,frame,t,phase){
    if(phase==='in'){ const e=easeOutCubic(t); drawClip(ctx,clip,frame,0.9+0.1*e, e, 0,0); }
    else if(phase==='out'){ const e=easeOutCubic(1-t); drawClip(ctx,clip,frame,1+0.04*(1-e), e, 0,0); }
    else { const e=easeOutCubic(clamp(t,0,1)); drawClip(ctx,clip,frame,1.0+0.03*e, 1, 0,0); }
  }},
  zoomOut: { name:'Zoom out', fn(ctx,clip,frame,t,phase){
    if(phase==='in'){ const e=easeOutCubic(t); drawClip(ctx,clip,frame,1.15-0.15*e, e, 0,0); }
    else if(phase==='out'){ const e=easeOutCubic(1-t); drawClip(ctx,clip,frame,1+0.04*(1-e), e, 0,0); }
    else drawClip(ctx,clip,frame,1.0, 1, 0,0);

  slideUp: { name:'Slide up', fn(ctx,clip,frame,t,phase){
    const [x,y,w,h]=frame;

    else if(phase==='out'){ const e=easeOutCubic(1-t); drawClip(ctx,clip,frame,1, e, 0, -(1-e)*h*0.25); }
    else drawClip(ctx,clip,frame,1,1,0,0);
  }},
  // Shutter: the current shot drops out of its frame like a falling panel,
  // uncovering the next shot underneath, which lifts out of shadow.
  slideDown: { name:'Slide down', fn(ctx,clip,frame,t,phase,absT,dur,next){
    if(phase!=='out'){ drawClip(ctx,clip,frame,1,1,0,0); return; }
    const [x,y,w,h]=frame;
    const e = easeInOutCubic(t);
    const dy = e*h;

    if(next){
      drawClip(ctx,next,frame,1.04-0.04*e,1,0,0,{noShadow:true});
      ctx.fillStyle = `rgba(0,0,0,${0.6*(1-e)})`;
      ctx.fillRect(x,y,w,h);
    } else {
      ctx.fillStyle = state.bgMode==='dark' ? '#0f0f10' : '#ffffff';
      ctx.fillRect(x,y,w,h);
    }
    // Shadow cast by the falling panel onto the revealed shot.
    const sh = h*0.14, top = y+dy;
    const g = ctx.createLinearGradient(0, top-sh, 0, top);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(0,0,0,${0.5*(1-e*0.6)})`);
    ctx.fillStyle = g;
    ctx.fillRect(x, top-sh, w, sh);
    drawClip(ctx,clip,[x,top,w,h],1,1,0,0,{noShadow:true});
    // The panel dims slightly as it drops away.
    ctx.fillStyle = `rgba(0,0,0,${0.3*e})`;
    ctx.fillRect(x, top, w, h);
    ctx.restore();
  }},
  slideLeft: { name:'Slide left', fn(ctx,clip,frame,t,phase){
    const [x,y,w,h]=frame;

    let r = maxR;
    if(phase==='in') r = maxR*easeOutCubic(t);
    if(phase==='out') r = maxR*easeOutCubic(1-t);
    ctx.save();

    if(Math.abs(sx) < 0.02) return;
    ctx.save();
    ctx.translate(cx,cy); ctx.scale(sx,1); ctx.translate(-cx,-cy);
    drawClip(ctx,clip,frame,1,a,0,0);
    ctx.restore();
  }},
  perspective: { name:'Perspective', fn(ctx,clip,frame,t,phase){
    const [x,y,w,h]=frame;
    const cx=x+w/2, cy=y+h/2;
    let sy=1, rot=0, a=1;
    if(phase==='in'){ const e=easeOutCubic(t); sy=0.6+0.4*e; rot=(1-e)*0.05; a=t; }
    else if(phase==='out'){ const e=easeOutCubic(1-t); sy=0.7+0.3*e; rot=-(1-e)*0.05; a=t; }
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(rot); ctx.scale(1,sy); ctx.translate(-cx,-cy);
    drawClip(ctx,clip,frame,1,a,0,0);
    ctx.restore();
  }},
  zoomBlur: { name:'Zoom blur', fn(ctx,clip,frame,t,phase){
    if(phase==='in'){ const e=easeOutCubic(t); ctx.save(); ctx.filter=`blur(${(1-e)*22}px)`; drawClip(ctx,clip,frame,1.25-0.25*e, e, 0,0); ctx.restore(); }
    else if(phase==='out'){ const e=easeOutCubic(1-t); ctx.save(); ctx.filter=`blur(${(1-e)*18}px)`; drawClip(ctx,clip,frame,1+0.1*(1-e), e, 0,0); ctx.restore(); }
    else drawClip(ctx,clip,frame,1,1,0,0);
  }},
  pulse: { name:'Pulse', fn(ctx,clip,frame,t,phase,absT){
    const a = phase==='in' ? t : phase==='out' ? 1-t : 1;
    let z = 1;
    if(phase==='hold'){
      const decay = Math.max(0, 1 - t*3);
      z = 1 + 0.04 * Math.sin(absT*0.02) * decay;
    } else if(phase==='in'){
      z = 0.96 + 0.04*easeOutCubic(t);
    }
    drawClip(ctx,clip,frame,z,a,0,0);
  }},
  diagonal: { name:'Diagonal', fn(ctx,clip,frame,t,phase){
    const [x,y,w,h]=frame;
    if(phase==='in'){ const e=easeOutCubic(t); drawClip(ctx,clip,frame,1, e, (1-e)*w*0.25, (1-e)*h*0.25); }
    else if(phase==='out'){ const e=easeOutCubic(1-t); drawClip(ctx,clip,frame,1, e, -(1-e)*w*0.25, -(1-e)*h*0.25); }
    else drawClip(ctx,clip,frame,1,1,0,0);
  }},
};

/* ----------------------------- drawing primitives ----------------------------- */
// Corner radius for a tile, as a % of its shorter side (Style → Corner radius).
function cornerRadius(w,h){ return Math.min(w,h) * state.radiusPct / 100; }
function roundedClip(ctx,x,y,w,h,r=10){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.clip();
}
// Drop shadow under a tile (Frame → Shadow / Softness). Uses the current alpha.
function drawFrameShadow(ctx, frame){
  if(!(state.shadowPct > 0)) return;
  const [x,y,w,h] = frame;
  const k = state.shadowPct/100, soft = state.shadowBlur/100;
  const m = Math.min(cv.width, cv.height), r = cornerRadius(w,h);
  ctx.save();
  ctx.shadowColor = `rgba(0,0,0,${(0.12 + 0.58*k).toFixed(3)})`;
  ctx.shadowBlur = m * (0.008 + 0.09*soft);
  ctx.shadowOffsetY = m * (0.004 + 0.03*k) * (0.4 + soft);
  ctx.fillStyle = state.bgMode==='dark' ? '#0f0f10' : '#ffffff';
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawClip(ctx, clip, frame, zoom=1, alpha=1, dx=0, dy=0, opts={}){
  if(!clip||!clip.el) return;
  const [x,y,w,h] = frame;
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = clamp(alpha,0,1);
  if(!opts.noShadow) drawFrameShadow(ctx, frame);
  roundedClip(ctx,x,y,w,h,cornerRadius(w,h));
  // background fill behind transparent images
  ctx.fillStyle = state.bgMode==='dark' ? '#0f0f10' : '#ffffff';
  ctx.fillRect(x,y,w,h);
  // fit modes: cover (fill frame, may crop), contain (letterbox), fill (stretch)
  const ar = clip.w/clip.h, br = w/h;
  let dw, dh;
  if(state.fit === 'fill'){
    dw = w*zoom; dh = h*zoom;
  } else if(state.fit === 'contain'){
    if(ar > br){ dw = w*zoom; dh = dw/ar; }
    else       { dh = h*zoom; dw = dh*ar; }
  } else { // cover
    if(ar > br){ dh = h*zoom; dw = dh*ar; }
    else       { dw = w*zoom; dh = dw/ar; }
  }
  const ix = x + (w-dw)/2 + dx;
  const iy = y + (h-dh)/2 + dy;
  // Pick the smallest pyramid level ≥ target so we never downscale > 2× in one pass.
  const src = pickSource(clip, Math.ceil(dw), Math.ceil(dh));
  try{ ctx.drawImage(src, ix, iy, dw, dh); }catch(e){}
  if(opts.tint){
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle = opts.tint;
    ctx.globalAlpha = 0.4;
    ctx.fillRect(x,y,w,h);
  }
  ctx.restore();
}

/* Empty-state slots — dashed placeholders so users can see where their
   designs will land in the current layout. */
function drawEmptySlots(ctx, W, H){
  const box = inset(W,H);
  const layout = layouts[state.templateId];
  const frames = layout.continuous ? [[box.x, box.y, box.w, box.h]] : layout.frames(W, H);
  const stroke = state.bgMode==='dark' ? '#27272d' : '#cfcfca';
  const fill   = state.bgMode==='dark' ? '#161618' : '#ececea';
  const text   = state.bgMode==='dark' ? '#4a4a52' : '#9a9aa0';
  ctx.save();
  frames.forEach((f, i) => {
    const [x,y,w,h] = f;
    ctx.fillStyle = fill;
    roundedRectStroke(ctx, x, y, w, h, cornerRadius(w,h), stroke, Math.max(2, W*0.0015), true);
    ctx.fillStyle = text;
    ctx.textAlign = 'center';
    ctx.font = `500 ${Math.min(w,h)*0.06}px -apple-system,"Inter",sans-serif`;
    ctx.fillText(`Slot ${i+1}`, x + w/2, y + h/2 - Math.min(w,h)*0.01);
    ctx.font = `400 ${Math.min(w,h)*0.035}px -apple-system,"Inter",sans-serif`;
    ctx.fillText('Drop image', x + w/2, y + h/2 + Math.min(w,h)*0.05);
  });
  ctx.restore();
}
function roundedRectStroke(ctx, x, y, w, h, r, strokeColor, lineWidth, fillFirst){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fillFirst) ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = lineWidth;
  ctx.setLineDash([lineWidth*4, lineWidth*3]);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ----------------------------- timeline ----------------------------- */
function computeTotal(){
  const layout = layouts[state.templateId];
  let units;
  if(layout.continuous){
    // Continuous layouts pace by total clips, not chunks
    units = Math.max(1, state.clips.length);
  } else {
    units = Math.max(1, Math.ceil(state.clips.length / layout.chunk));
  }
  state.totalMs = units * state.perDurMs;
  if(state.totalMs <= 0) state.totalMs = state.perDurMs;
  renderTimeline();
  if(typeof updateExportUI === 'function' && $('#exHint')) updateExportUI();
}

// Timeline: one thumbnail segment per clip, plus a playhead synced in render().
function renderTimeline(){
  const segs = $('#tlSegs'); if(!segs) return;
  segs.innerHTML = state.clips.map(c => `<div class="tl-seg" style="background-image:url('${c.thumb}')"></div>`).join('');
  $('#time').textContent = fmtMs(state.totalMs);
}
function syncTimeline(tMs){
  const p = state.totalMs ? clamp(tMs / state.totalMs, 0, 1) : 0;
  $('#tlTrack').style.setProperty('--p', (p*100) + '%');
  $('#seek').value = String(Math.round(p*1000));
  $('#tlCur').textContent = fmtMs(tMs);
}

function render(tMs){
  syncTimeline(tMs);
  const W=cv.width,H=cv.height;
  drawBackground(ctx, W, H, tMs);

  if(state.clips.length===0){
    drawEmptySlots(ctx, W, H);
    return;
  }


  const layout = layouts[state.templateId];

  // Continuous layouts draw everything themselves with built-in motion.
  if(layout.continuous){
    layout.draw(ctx, W, H, state.clips, tMs, state.totalMs);
    return;
  }

  const chunk = layout.chunk;
  const units = Math.ceil(state.clips.length / chunk);
  const slot = Math.min(units-1, Math.floor(tMs / state.perDurMs));
  const slotStartMs = slot*state.perDurMs;
  const inSlotMs = tMs - slotStartMs;

  const tr = clamp(state.transMs, 0, state.perDurMs/2);
  let phase, t;
  if(inSlotMs < tr){ phase='in'; t = tr===0 ? 1 : inSlotMs/tr; }
  else if(inSlotMs > state.perDurMs - tr){ phase='out'; t = tr===0 ? 0 : (inSlotMs - (state.perDurMs - tr))/tr; }
  else { phase='hold'; const holdLen = state.perDurMs - 2*tr; t = holdLen<=0 ? 0 : (inSlotMs - tr)/holdLen; }

  const frames = layout.frames(W,H);
  const effect = effects[state.effectId] || effects.none;
  const base = slot*chunk;

  if(layout.pre) layout.pre(ctx, W, H, frames[0]);

  for(let i=0;i<chunk;i++){
    const idx = (base + i) % state.clips.length;
    const clip = state.clips[idx];
    if(!clip) continue;
    const frame = frames[i];
    // stagger each tile slightly in chunked layouts
    let lt = t, lphase = phase;
    if(chunk>1 && phase!=='hold'){
      const stagger = i * 0.08;
      if(phase==='in'){
        const adj = clamp((t - stagger)/(1 - stagger), 0, 1);
        lt = adj;
      } else if(phase==='out'){
        const adj = clamp((t + stagger - (chunk-1)*0.08)/(1 - (chunk-1)*0.08), 0, 1);
        lt = adj;
      }
    }
    ctx.save();
    // Per-tile rotation (stack layouts)
    if(layout.rotations && layout.rotations[i]){
      const [fx,fy,fw,fh] = frame;
      const cxr = fx+fw/2, cyr = fy+fh/2;
      ctx.translate(cxr, cyr); ctx.rotate(layout.rotations[i]); ctx.translate(-cxr, -cyr);
    }
    // Per-tile polygon clip (diagonal split)
    if(layout.clips && layout.clips[i]){
      const pts = layout.clips[i](W,H);
      ctx.beginPath();
      pts.forEach((p,j)=> j===0 ? ctx.moveTo(p[0],p[1]) : ctx.lineTo(p[0],p[1]));
      ctx.closePath();
      ctx.clip();
    }
    const isLast = slot === units-1;
    const next = (isLast && !state.loop) ? null : state.clips[(idx + chunk) % state.clips.length];
    effect.fn(ctx, clip, frame, lt, lphase, tMs, state.perDurMs, next);
    ctx.restore();
  }
}

/* ----------------------------- playback ----------------------------- */
let rafId = null;
function tick(){
  if(!state.playing) return;
  const now = performance.now();
  let t = now - state.t0;
  if(t >= state.totalMs){
    if(state.loop){ state.t0 = now; t = 0; }
    else { pause(); t = state.totalMs; }
  }
  state.pausedMs = t;
  $('#seek').value = String(Math.round((t/state.totalMs)*1000));
  render(t);
  rafId = requestAnimationFrame(tick);
}
function play(){
  if(state.clips.length===0) return;
  computeTotal();
  state.playing = true;
  state.t0 = performance.now() - state.pausedMs;
  $('#btnPlay').textContent='Pause';
  $('#btnPlay2').classList.add('playing');
  rafId = requestAnimationFrame(tick);
}
function pause(){
  state.playing = false;
  cancelAnimationFrame(rafId);
  $('#btnPlay').textContent='Play';
  $('#btnPlay2').classList.remove('playing');
}
function togglePlay(){ state.playing ? pause() : play(); }
function restart(){ state.pausedMs = 0; if(state.playing){ state.t0 = performance.now(); } render(0); $('#seek').value=0; }

/* ----------------------------- UI ----------------------------- */
function renderBackgrounds(){
  const wrap = $('#bgSwatches'); if(!wrap) return;
  const thumb = state.clips[0] && state.clips[0].thumb;
  wrap.innerHTML = Object.entries(BACKGROUNDS).map(([id,b]) => {
    const sel = id === state.bgId ? ' sel' : '';
    if(id === 'custom'){
      return `<label class="sw custom${sel}" data-v="custom" title="Custom colour"><span class="dot" style="background:${state.bgCustom}"></span><input type="color" value="${state.bgCustom}" aria-label="Custom background colour"></label>`;
    }
    if(b.type === 'blur'){
      return `<button class="sw${sel}" data-v="${id}" title="Blurred shot" style="background:#222"><span class="blurimg" style="${thumb ? `background-image:url('${thumb}')` : ''}"></span><span class="lbl">Blur</span></button>`;
    }
    const bg = b.type === 'gradient' ? `linear-gradient(135deg,${b.colors.join(',')})` : b.colors[0];
    return `<button class="sw${sel}" data-v="${id}" title="${b.name}" style="background:${bg}"></button>`;
  }).join('');
  const nm = $('#bgName'); if(nm) nm.textContent = (BACKGROUNDS[state.bgId] || BACKGROUNDS.ink).name;
}
// Update selection in place (no re-render) so an open colour picker stays open.
function selectBg(id){
  state.bgId = id;
  $$('#bgSwatches .sw').forEach(el => el.classList.toggle('sel', el.dataset.v === id));
  const dot = $('#bgSwatches .custom .dot'); if(dot) dot.style.background = state.bgCustom;
  $('#bgName').textContent = (BACKGROUNDS[id] || BACKGROUNDS.ink).name;
  render(state.pausedMs);
}
function renderEffects(){
  const nm = $('#fxName'); if(nm) nm.textContent = (effects[state.effectId]||effects.none).name;
  const wrap = $('#effects'); wrap.innerHTML='';
  Object.entries(effects).forEach(([id,e])=>{
    const el = document.createElement('div');
    el.className = 'fx'+(id===state.effectId?' sel':'');
    el.textContent = e.name;
    el.onclick = ()=>{ state.effectId=id; renderEffects(); render(state.pausedMs); };
    wrap.appendChild(el);
  });
}
let clipSeq = 1;

// Reorder the clip list. Manual order is preserved via drag-and-drop, so the
// other modes are one-shot reorders the user can still tweak afterwards.
function sortClips(mode){
  const byName = (a,b) => (a.name||'').localeCompare(b.name||'', undefined, {numeric:true, sensitivity:'base'});
  if(mode==='az')        state.clips.sort(byName);
  else if(mode==='za')   state.clips.sort((a,b)=> byName(b,a));
  else if(mode==='newest') state.clips.sort((a,b)=> (b.addedAt||0)-(a.addedAt||0));
  else if(mode==='oldest') state.clips.sort((a,b)=> (a.addedAt||0)-(b.addedAt||0));
  else if(mode==='shuffle') state.clips = _shuffle(state.clips);
  else return; // 'manual' — leave as-is
  renderClips();
  computeTotal();
  render(state.pausedMs);
}

function renderClips(){
  renderTimeline();
  renderBackgrounds();
  const wrap = $('#clips'); wrap.innerHTML='';
  state.clips.forEach((c,i)=>{
    const row = document.createElement('div');
    row.className='clip';
    row.draggable = true;
    row.dataset.id = c.id;
    row.innerHTML = `
      <img class="thumb" src="${c.thumb}" />
      <div class="meta">
        <div class="nm">${c.isDemo ? '<span class="demoBadge">Sample</span>' : ''}<span>${c.name}</span></div>
        <div class="sm">${c.type} · ${c.w}×${c.h}</div>
      </div>
      <button class="x" title="Remove">×</button>
    `;
    row.querySelector('.x').onclick = ()=>{ state.clips.splice(i,1); renderClips(); computeTotal(); render(state.pausedMs); };
    row.addEventListener('dragstart', e=>{ row.classList.add('drag'); e.dataTransfer.setData('id', c.id); });
    row.addEventListener('dragend', ()=> row.classList.remove('drag'));
    row.addEventListener('dragover', e=>{ e.preventDefault(); });
    row.addEventListener('drop', e=>{
      e.preventDefault();
      const id = e.dataTransfer.getData('id');
      const from = state.clips.findIndex(x=>x.id===id);
      const to = i;
      if(from<0||from===to) return;
      const [moved] = state.clips.splice(from,1);
      state.clips.splice(to,0,moved);
      const sortSel = $('#sortSel'); if(sortSel) sortSel.value = 'manual';
      renderClips();
      render(state.pausedMs);
    });
    wrap.appendChild(row);
  });
}

/* ----------------------------- file ingest ----------------------------- */
async function ingestFiles(fileList){
  // Remove any demo "inspiration" clips when the user adds their own.
  if(state.clips.some(c => c.isDemo)){
    state.clips = state.clips.filter(c => !c.isDemo);
    renderClips();
  }
  setStatus('Loading designs…');
  for(const f of fileList){
    try{
      const isVideo = f.type.startsWith('video');
      const url = URL.createObjectURL(f);
      if(isVideo){
        const v = document.createElement('video');
        v.src = url; v.muted=true; v.loop=true; v.playsInline=true;
        await new Promise((res,rej)=>{ v.onloadedmetadata = res; v.onerror = rej; });
        await v.play().catch(()=>{});
        const thumb = await captureThumb(v, v.videoWidth, v.videoHeight);
        state.clips.push({id:uuid(),name:f.name,type:'video',el:v,w:v.videoWidth,h:v.videoHeight,thumb,blob:f,addedAt:clipSeq++});
      }else{
        const img = new Image();
        img.src = url;
        await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });
        const thumb = await captureThumb(img, img.naturalWidth, img.naturalHeight);
        state.clips.push({id:uuid(),name:f.name,type:'image',el:img,w:img.naturalWidth,h:img.naturalHeight,thumb,blob:f,addedAt:clipSeq++});
      }
    }catch(e){ console.warn('skip',f.name,e); }
  }
  rebuildScaledCache();
  renderClips();
  computeTotal();
  render(state.pausedMs);
  setStatus('', false);
}
function captureThumb(src, w, h){
  return new Promise(res=>{
    const c = document.createElement('canvas');
    const r = 120/Math.max(w,h);
    c.width = Math.round(w*r); c.height = Math.round(h*r);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.7));
  });
}

/* ----------------------------- demo / inspiration clips -----------------------------
   Six random nature/landscape photos fetched from Picsum so the app shows
   real content on first load. They get cleared automatically the moment
   the user uploads their own files. */


// Fetches one Picsum random photo as an Image with CORS so it can be drawn
// to the canvas without tainting it (keeps WebM export working).
function loadRandomPhoto(seed, w=1600, h=900){
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = `https://picsum.photos/seed/${seed}/${w}/${h}`;
  });
}

function _rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function _shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Randomize the whole showreel: layout, effect, timing, fit, padding, gap, and
// shuffle clip order. If only demo clips are loaded, also pulls in a fresh
// set of Picsum photos so the visual content rotates too.
async function inspireMe(){
  const btn = $('#inspireBtn'); if(btn){ btn.classList.add('spin'); setTimeout(()=>btn.classList.remove('spin'), 650); }

  // Random layout + effect
  state.effectId = _rand(Object.keys(effects).filter(k => k !== 'none'));
  // Random timing (snapped to 100ms / 50ms), weighted around 2–3s per clip.
  state.perDurMs = Math.round((1600 + Math.random() * 2200) / 100) * 100;
  state.transMs = Math.round((300 + Math.random() * 600) / 50) * 50;
  // Random fit & framing (cover is most common — looks best for nature shots).
  state.fit = _rand(['cover','cover','cover','contain']);
  state.paddingPct = _rand([0, 0, 4, 6, 8, 12]);
  state.radiusPct = _rand([0, 1, 2, 2, 4, 6]);
  // Background tone shuffle
  state.bgId = _rand(['ink','ink','graphite','paper','blur','blur','dusk','ocean','ember','mint','peach']);
  state.shadowPct = _rand([0, 20, 30, 45, 60]);
  state.shadowBlur = _rand([30, 50, 70]);

  // If only demo clips are loaded, refresh them too.
  const onlyDemos = state.clips.length === 0 || state.clips.every(c => c.isDemo);
  if(onlyDemos){
    await loadDemoClips(6);
  } else {
    state.clips = _shuffle(state.clips);
    renderClips();
  }

  syncAllControls();
  computeTotal();
  state.pausedMs = 0;
  $('#seek').value = 0;
  if(!state.playing) play(); else { state.t0 = performance.now(); render(0); }
}

async function loadDemoClips(count = 6){
  // Drop existing demos before loading fresh ones (also used by Inspire Me).
  state.clips = state.clips.filter(c => !c.isDemo);
  const seeds = Array.from({length: count}, () =>
    Math.random().toString(36).slice(2, 10)
  );
  setStatus('Loading inspiration…');
  const loaded = await Promise.allSettled(seeds.map(s => loadRandomPhoto(s)));
  for(let i=0;i<loaded.length;i++){
    if(loaded[i].status !== 'fulfilled') continue;
    const img = loaded[i].value;
    const thumb = await captureThumb(img, img.naturalWidth, img.naturalHeight);
    state.clips.push({
      id: uuid(),
      name: `Inspiration ${i+1}`,
      type: 'image',
      el: img,
      w: img.naturalWidth, h: img.naturalHeight,
      thumb,
      isDemo: true,
      addedAt: clipSeq++,
    });
  }
  rebuildScaledCache();
  renderClips();
  computeTotal();
  render(state.pausedMs);
  setStatus('', false);
}

/* ----------------------------- saved work (IndexedDB) -----------------------------
   Compositions (clips + every setting) are stored locally in IndexedDB so the
   user can reopen a past project and re-export it any time — even offline. */
const Store = (function(){
  const NAME='showreel-db', STORE='compositions', VER=1;
  let dbp;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      const req = indexedDB.open(NAME, VER);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:'id'});
      };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
    return dbp;
  }
  function run(mode, fn){
    return open().then(db => new Promise((res,rej)=>{
      const t = db.transaction(STORE, mode);
      const st = t.objectStore(STORE);
      const r = fn(st);
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    }));
  }
  return {
    put: rec => run('readwrite', st => st.put(rec)),
    get: id  => run('readonly',  st => st.get(id)),
    all: ()  => run('readonly',  st => st.getAll()),
    del: id  => run('readwrite', st => st.delete(id)),
  };
})();

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Push the full state back onto every UI control (used after loading a project).
function syncAllControls(){
  state.mode = 'custom';

  if(state.radiusPct == null) state.radiusPct = 2;

// Get a storable Blob for a clip — prefer the original source, else re-encode.
async function clipToBlob(clip){
  if(clip.blob) return clip.blob;
  if(clip.type === 'image' && clip.el){
    const c = document.createElement('canvas');
    c.width = clip.w; c.height = clip.h;
    c.getContext('2d').drawImage(clip.el, 0, 0, clip.w, clip.h);
    return await new Promise(r => c.toBlob(r, 'image/png'));
  }
  return null;
}

function defaultProjName(){
  const d = new Date();
  return 'Showreel ' + d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function saveComposition(){
  if(state.clips.length === 0){ alert('Add some designs before saving.'); return; }
  // Don't persist the throwaway inspiration photos unless that's all there is.
  const real = state.clips.filter(c => !c.isDemo);
  const useClips = real.length ? real : state.clips;
  const name = (prompt('Name this composition', defaultProjName()) || '').trim();
  if(!name) return;

  setStatus('Saving…');
  try{
    const clips = [];
    for(const c of useClips){
      const blob = await clipToBlob(c);
      if(!blob) continue;
      clips.push({id:c.id, name:c.name, type:c.type, w:c.w, h:c.h, thumb:c.thumb, blob});
    }
    if(!clips.length){ setStatus('', false); alert('Nothing could be saved from this composition.'); return; }
    const settings = {};
    SETTINGS_KEYS.forEach(k => settings[k] = state[k]);
    let preview = null;
    try{ preview = cv.toDataURL('image/jpeg', 0.6); }catch(e){ /* tainted canvas — skip */ }
    await Store.put({ id: uuid(), name, createdAt: Date.now(), count: clips.length, settings, clips, preview });
    await renderProjects();
    setStatus('', false);
    audio.play('success');
  }catch(err){
    console.error(err);
    setStatus('', false);
    alert('Could not save: ' + (err && err.message ? err.message : err));
  }
}

async function loadComposition(id){
  let rec;
  try{ rec = await Store.get(id); }catch(e){ console.error(e); }
  if(!rec){ alert('That saved work could not be found.'); return; }
  pause();
  setStatus('Loading saved work…');
  try{
    const clips = [];
    for(const cr of rec.clips){
      const url = URL.createObjectURL(cr.blob);
      if(cr.type === 'video'){
        const v = document.createElement('video');
        v.src = url; v.muted = true; v.loop = true; v.playsInline = true;
        await new Promise(res => { v.onloadedmetadata = res; v.onerror = res; });
        await v.play().catch(()=>{});
        clips.push({id:cr.id||uuid(), name:cr.name, type:'video', el:v, w:cr.w||v.videoWidth, h:cr.h||v.videoHeight, thumb:cr.thumb, blob:cr.blob, addedAt:clipSeq++});
      }else{
        const img = new Image();
        img.src = url;
        await new Promise(res => { img.onload = res; img.onerror = res; });
        clips.push({id:cr.id||uuid(), name:cr.name, type:'image', el:img, w:cr.w||img.naturalWidth, h:cr.h||img.naturalHeight, thumb:cr.thumb, blob:cr.blob, addedAt:clipSeq++});
      }
    }
    state.clips = clips;
    Object.assign(state, rec.settings || {});
    applyAspect();          // resets canvas resolution + rebuilds the scaled cache
    syncAllControls();
    renderClips();
    computeTotal();
    state.pausedMs = 0;
    $('#seek').value = 0;
    render(0);
    setStatus('', false);
    audio.play('pop');
  }catch(err){
    console.error(err);
    setStatus('', false);
    alert('Could not open that composition: ' + (err && err.message ? err.message : err));
  }
}

async function deleteComposition(id){
  if(!confirm('Delete this saved composition? This cannot be undone.')) return;
  try{ await Store.del(id); }catch(e){ console.error(e); }
  renderProjects();
}

async function renderProjects(){
  const wrap = $('#projList'); if(!wrap) return;
  let recs = [];
  try{ recs = await Store.all(); }catch(e){ console.warn('saved work unavailable', e); }
  recs.sort((a,b) => b.createdAt - a.createdAt);
  if(!recs.length){
    wrap.innerHTML = '<div class="hint" style="margin-top:0">No saved work yet — save a composition to reopen and re-export it later, even offline.</div>';
    return;
  }
  wrap.innerHTML = '';
  for(const r of recs){
    const when = new Date(r.createdAt).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    const cover = r.preview || (r.clips[0] && r.clips[0].thumb) || '';
    const row = document.createElement('div');
    row.className = 'proj';
    row.innerHTML = `
      <img class="thumb" src="${cover}" alt="" />
      <div class="meta">
        <div class="nm"><span>${escapeHtml(r.name)}</span></div>
        <div class="sm">${r.count || r.clips.length} clip${(r.count||r.clips.length)===1?'':'s'} · ${when}</div>
      </div>
      <div class="acts">
        <button class="btn ghost open" title="Open in editor">Open</button>
        <button class="x del" title="Delete">×</button>
      </div>`;
    row.querySelector('.open').onclick = () => loadComposition(r.id);
    row.querySelector('.del').onclick = () => deleteComposition(r.id);
    wrap.appendChild(row);
  }
}

/* ----------------------------- export ----------------------------- */
function downloadBlob(blob, ext){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `showreel-${state.aspect.replace(':','x')}-${Date.now()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

function exportFormat(){ return state.exFormat === 'gif' ? 'gif' : 'mp4'; }

// Dispatch based on the chosen format.
async function exportShowreel(){
  if(state.clips.length===0){ alert('Add some designs first.'); return; }
  const fmt = exportFormat();
  try{
    if(fmt==='gif') await exportGIF();
    else await exportVideo(fmt);
  }catch(err){
    console.error(err);
    setStatus('', false);
    alert('Export failed: ' + (err && err.message ? err.message : err));
  }
}

// WebM / MP4 via MediaRecorder + canvas stream (real-time paced).
async function exportVideo(fmt){
  pause();
  computeTotal();
  const {fps, mbps: br} = exportSpec();

  const candidates = fmt==='mp4'
    ? ['video/mp4;codecs=h264','video/mp4;codecs=avc1.42E01E','video/mp4']
    : ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  let mime = candidates.find(m => MediaRecorder.isTypeSupported(m));
  if(!mime){
    if(fmt==='mp4'){
      alert('MP4 recording isn’t supported in this browser — exporting WebM instead. (Tip: Safari supports MP4 export.)');
      return exportVideo('webm');
    }
    mime = 'video/webm';
  }
  const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
  setStatus('Exporting…');

  const stream = cv.captureStream(fps);
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond: br*1_000_000});
  const chunks = [];
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(r => rec.onstop = r);

  rec.start();
  const totalMs = state.totalMs;
  const step = 1000/fps;
  const startWall = performance.now();
  for(let t=0; t<=totalMs+1; t+=step){
    render(t);
    const target = startWall + t;
    while(performance.now() < target){ await new Promise(r=>requestAnimationFrame(r)); }
    setStatus(`Exporting… ${Math.min(100,Math.round(t/totalMs*100))}%`);
  }
  rec.stop();
  await done;
  const blob = new Blob(chunks, {type: mime});
  downloadBlob(blob, ext);
  setStatus('', false);
  audio.play('success');
}

// Animated GIF via a self-contained encoder (no external deps, works offline).
async function exportGIF(){
  pause();
  computeTotal();
  setStatus('Rendering GIF…');

  const {fps, w: gw, h: gh} = exportSpec();
  const step = 1000/fps;

  const tmp = document.createElement('canvas');
  tmp.width = gw; tmp.height = gh;
  const tctx = tmp.getContext('2d', {willReadFrequently:true});
  tctx.imageSmoothingEnabled = true; tctx.imageSmoothingQuality = 'high';

  const totalMs = state.totalMs;
  const frames = [];
  for(let t=0; t<=totalMs+1; t+=step){
    render(t);
    tctx.clearRect(0,0,gw,gh);
    tctx.drawImage(cv, 0,0, gw,gh);
    frames.push(tctx.getImageData(0,0,gw,gh).data);
    setStatus(`Rendering GIF… ${Math.min(99, Math.round(t/totalMs*60))}%`);
    await new Promise(r=>requestAnimationFrame(r));
  }

  setStatus('Encoding GIF…');
  await new Promise(r=>setTimeout(r,20));       // let the status paint
  const bytes = GifEncoder.encode(frames, gw, gh, step);
  const blob = new Blob([bytes], {type:'image/gif'});
  downloadBlob(blob, 'gif');
  setStatus('', false);
  audio.play('success');
}

/* ----- self-contained GIF encoder: median-cut palette + GIF-LZW ----- */
const GifEncoder = (function(){
  // Build a <=256 color palette from flat [r,g,b,...] samples via median cut.
  function medianCut(samples, maxColors){
    const n = samples.length/3;
    const idx = new Uint32Array(n);
    for(let i=0;i<n;i++) idx[i]=i;
    function rangeOf(lo,hi){
      let rmin=255,rmax=0,gmin=255,gmax=0,bmin=255,bmax=0;
      for(let i=lo;i<hi;i++){
        const p=idx[i]*3, r=samples[p], g=samples[p+1], b=samples[p+2];
        if(r<rmin)rmin=r; if(r>rmax)rmax=r;
        if(g<gmin)gmin=g; if(g>gmax)gmax=g;
        if(b<bmin)bmin=b; if(b>bmax)bmax=b;
      }
      return [rmax-rmin, gmax-gmin, bmax-bmin];
    }
    const boxes = [{lo:0, hi:n, range:rangeOf(0,n)}];
    while(boxes.length < maxColors){
      let bi=-1, best=-1;
      for(let i=0;i<boxes.length;i++){
        const b=boxes[i];
        if(b.hi-b.lo<=1) continue;
        const mr=Math.max(b.range[0],b.range[1],b.range[2]);
        if(mr>best){ best=mr; bi=i; }
      }
      if(bi<0) break;
      const b=boxes[bi];
      const ch = (b.range[0]>=b.range[1] && b.range[0]>=b.range[2]) ? 0
               : (b.range[1]>=b.range[2] ? 1 : 2);
      const sub = Array.prototype.slice.call(idx.subarray(b.lo, b.hi));
      sub.sort((a,c)=> samples[a*3+ch] - samples[c*3+ch]);
      for(let i=0;i<sub.length;i++) idx[b.lo+i]=sub[i];
      const mid=(b.lo+b.hi)>>1;
      const b1={lo:b.lo, hi:mid}, b2={lo:mid, hi:b.hi};
      b1.range=rangeOf(b1.lo,b1.hi); b2.range=rangeOf(b2.lo,b2.hi);
      boxes.splice(bi,1,b1,b2);
    }
    const palette=[];
    for(const b of boxes){
      let r=0,g=0,bl=0; const cnt=Math.max(1,b.hi-b.lo);
      for(let i=b.lo;i<b.hi;i++){ const p=idx[i]*3; r+=samples[p]; g+=samples[p+1]; bl+=samples[p+2]; }
      palette.push([Math.round(r/cnt), Math.round(g/cnt), Math.round(bl/cnt)]);
    }
    while(palette.length<2) palette.push([0,0,0]);
    return palette;
  }

  // GIF variable-width LZW. Returns image-data sub-blocks incl. terminator.
  function lzwEncode(minCodeSize, indices){
    const clear = 1<<minCodeSize;
    const eoi = clear+1;
    let codeSize = minCodeSize+1;
    let dict = new Map();
    let next = clear+2;
    function reset(){ dict=new Map(); next=clear+2; codeSize=minCodeSize+1; }

    const out=[]; let block=[]; let cur=0, curBits=0;
    function flushBlock(){ if(block.length){ out.push(block.length); for(let i=0;i<block.length;i++) out.push(block[i]); block=[]; } }
    function writeByte(byte){ block.push(byte); if(block.length===255) flushBlock(); }
    function emit(code){
      cur |= code << curBits; curBits += codeSize;
      while(curBits>=8){ writeByte(cur & 0xff); cur >>>= 8; curBits -= 8; }
    }

    emit(clear);
    let prefix = indices[0];
    for(let i=1;i<indices.length;i++){
      const k = indices[i];
      const key = prefix*256 + k;
      if(dict.has(key)){
        prefix = dict.get(key);
      } else {
        emit(prefix);
        if(next < 4096){
          // Widen codes just before adding the entry that needs the extra bit —
          // the point at which a GIF decoder widens its own reads.
          if(next >= (1<<codeSize)) codeSize++;
          dict.set(key, next++);
        } else {
          emit(clear);
          reset();
        }
        prefix = k;
      }
    }
    emit(prefix);
    emit(eoi);
    if(curBits>0) writeByte(cur & 0xff);
    flushBlock();
    out.push(0); // block terminator
    return out;
  }

  function quantize(frames, w, h){
    const totalPx = w*h*frames.length;
    const target = 24000;
    const stride = Math.max(1, Math.floor(totalPx/target));
    const samples=[]; let c=0;
    for(const f of frames){
      for(let p=0;p<f.length;p+=4){
        if((c++ % stride)===0){ samples.push(f[p], f[p+1], f[p+2]); }
      }
    }
    const palette = medianCut(new Uint8Array(samples), 256);
    const cache = new Int16Array(32768).fill(-1);
    function nearest(r,g,b){
      const key = ((r>>3)<<10)|((g>>3)<<5)|(b>>3);
      const cached = cache[key];
      if(cached>=0) return cached;
      let bi=0, bd=1e9;
      for(let i=0;i<palette.length;i++){
        const dr=r-palette[i][0], dg=g-palette[i][1], db=b-palette[i][2];
        const d=dr*dr+dg*dg+db*db;
        if(d<bd){ bd=d; bi=i; }
      }
      cache[key]=bi; return bi;
    }
    return {palette, nearest};
  }

  function encode(frames, w, h, delayMs){
    const {palette, nearest} = quantize(frames, w, h);
    const minCodeSize = 8;
    const bytes = [];
    const push = (...a)=>{ for(let i=0;i<a.length;i++) bytes.push(a[i]); };
    const pushStr = s => { for(let i=0;i<s.length;i++) bytes.push(s.charCodeAt(i)); };

    pushStr('GIF89a');
    push(w&255,(w>>8)&255, h&255,(h>>8)&255);  // logical screen size
    push(0xF7, 0, 0);                            // global table, 256 colors, bg, aspect
    for(let i=0;i<256;i++){ const c=palette[i]||[0,0,0]; push(c[0],c[1],c[2]); }
    push(0x21,0xFF,0x0B); pushStr('NETSCAPE2.0'); push(0x03,0x01,0x00,0x00,0x00); // loop forever

    const delay = Math.max(2, Math.round(delayMs/10)); // centiseconds
    for(const f of frames){
      push(0x21,0xF9,0x04, 0x00, delay&255,(delay>>8)&255, 0x00, 0x00); // graphic control
      push(0x2C, 0,0,0,0, w&255,(w>>8)&255, h&255,(h>>8)&255, 0x00);    // image descriptor
      const indices = new Uint8Array(w*h);
      for(let p=0,q=0;p<f.length;p+=4,q++){ indices[q]=nearest(f[p],f[p+1],f[p+2]); }
      push(minCodeSize);
      const lzw = lzwEncode(minCodeSize, indices);
      for(let i=0;i<lzw.length;i++) bytes.push(lzw[i]);
    }
    push(0x3B);
    return new Uint8Array(bytes);
  }

  return { encode };
})();

/* ----------------------------- wiring ----------------------------- */
/* ----------------------------- controls ----------------------------- */
// `curve` sliders map a 0–1000 track onto [min,max] quadratically, so the
// short end (fast cuts) gets most of the travel and finer control.
const SLIDERS = [
  {id:'dur',     key:'perDurMs',   curve:{min:50, max:10000, step:10},
   fmt: v => (v/1000).toFixed(v < 1000 ? 2 : 1), unit:'s'},
  {id:'trans',   key:'transMs',    curve:{min:0, max:3000, step:10},
   fmt: v => v >= 1000 ? (v/1000).toFixed(2) : String(v), unit: v => v >= 1000 ? 's' : 'ms'},
  {id:'padding', key:'paddingPct', fmt: v => String(v),           unit:'%'},
  {id:'radius',  key:'radiusPct',  fmt: v => String(v),           unit:'%'},
  {id:'shadow',  key:'shadowPct',  fmt: v => String(v),           unit:'%'},
  {id:'shadowBlur', key:'shadowBlur', fmt: v => String(v),        unit:'%'},
];
function curveVal(c, pos){
  const v = c.min + (c.max - c.min) * Math.pow(pos/1000, 2);
  return clamp(Math.round(v / c.step) * c.step, c.min, c.max);
}
function curvePos(c, v){ return Math.round(Math.sqrt(clamp((v - c.min) / (c.max - c.min), 0, 1)) * 1000); }
function syncSlider(sl){
  const el = $('#'+sl.id);
  const v = state[sl.key];
  el.value = sl.curve ? curvePos(sl.curve, v) : v;
  const pct = (el.value - el.min) / (el.max - el.min) * 100;
  el.parentElement.style.setProperty('--p', pct + '%');
  $('#'+sl.id+'Val').textContent = sl.fmt(v);
  $('#'+sl.id+'Unit').textContent = typeof sl.unit === 'function' ? sl.unit(v) : sl.unit;
}
// A transition can take at most half a clip (one in, one out).
function clampTransition(){
  const max = Math.floor(state.perDurMs / 2 / 10) * 10;
  if(state.transMs > max){ state.transMs = max; syncSlider(SLIDERS[1]); }
}
function bindToggle(id, fn){
  $('#'+id).addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    setToggle(id, b.dataset.v);
    fn(b.dataset.v);
    updateExportUI();
  });
}

/* Export settings → concrete numbers. Quality scales bitrate for MP4 and
   frame rate for GIF; GIF resolution is the short side in px. */
const RES_LABEL = {hd:'720p', fhd:'1080p', qhd:'1440p', uhd:'4K'};
const BASE_MBPS = {hd:8, fhd:16, qhd:28, uhd:45};
const QUALITY_MULT = {low:0.5, medium:1, high:1.75};
const GIF_FPS = {low:10, medium:15, high:24};
function exportSpec(){
  if(state.exFormat === 'gif'){
    const short = Math.min(cv.width, cv.height);
    const scale = Math.min(1, state.gifRes / short);
    return { fmt:'gif', w: Math.round(cv.width*scale), h: Math.round(cv.height*scale), fps: GIF_FPS[state.exQuality] || 15 };
  }
  const mbps = Math.round(BASE_MBPS[state.quality] * (QUALITY_MULT[state.exQuality] || 1) * (state.fps > 30 ? 1.25 : 1));
  return { fmt:'mp4', w: cv.width, h: cv.height, fps: state.fps, mbps: Math.min(mbps, 100) };
}
function updateExportUI(){
  const isGif = state.exFormat === 'gif';
  $$('.export [data-for]').forEach(el => { el.hidden = el.dataset.for !== state.exFormat; });
  const sp = exportSpec();
  const secs = (state.totalMs/1000).toFixed(1);
  $('#exHint').innerHTML = isGif
    ? `<b>${sp.w}×${sp.h}</b> · ${sp.fps} fps · ${secs}s<br>256-color GIF. Larger sizes take longer to encode.`
    : `<b>${sp.w}×${sp.h}</b> · ${sp.fps} fps · ~${sp.mbps} Mbps · ${secs}s<br>H.264 MP4. Falls back to WebM if this browser can't record MP4.`;
}

function wire(){
  const drop = $('#drop'), file = $('#file');

  file.addEventListener('change', e => ingestFiles(e.target.files));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => ingestFiles(e.dataTransfer.files));

  window.addEventListener('dragover', e=>e.preventDefault());
  window.addEventListener('drop', e=>{
    e.preventDefault();
    if(e.dataTransfer?.files?.length) ingestFiles(e.dataTransfer.files);
  });

  $('#btnPlay').onclick = togglePlay;
  $('#btnPlay2').onclick = togglePlay;

  bindToggle('gifRes', v => { state.gifRes = +v; });

  bindToggle('fpsSel', v => { state.fps = +v; });
