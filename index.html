  $('#themeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    applyTheme(b.dataset.v);
    setToggle('themeSeg', b.dataset.v);
    try{ localStorage.setItem('showreel-theme', b.dataset.v); }catch(err){}
  });
  $('#btnSound').onclick = () => { audio.setMuted(!audio.muted); };
  // Initialize the mute button's visual state and play a tiny "boot" tone so
  // users immediately know sounds are on.
  audio.setMuted(audio.muted);
  if(!audio.muted){
    // First gesture is needed to actually start AudioContext, so don't try to
    // play here — the next real click handles it.
  }
  $('#btnReset').onclick = ()=>{
    if(!confirm('Clear all clips?')) return;
    state.clips = []; state.pausedMs=0; pause(); renderClips(); computeTotal(); render(0);
  };

  $('#seek').oninput = e => {
    const t = (+e.target.value/1000) * state.totalMs;
    state.pausedMs = t;
    if(state.playing) state.t0 = performance.now() - t;
    render(t);
    };

  SLIDERS.forEach(sl => {
    const el = $('#'+sl.id);
    el.addEventListener('input', () => {
      state[sl.key] = sl.curve ? curveVal(sl.curve, +el.value) : +el.value;
      syncSlider(sl);
      if(sl.key === 'perDurMs' || sl.key === 'transMs') clampTransition();
      if(sl.key === 'perDurMs') computeTotal();
      render(state.pausedMs);
      if(sl.key === 'perDurMs' || sl.key === 'transMs') updateExportUI();
    });
  });
  $('#loop').onchange = e=>{ state.loop = e.target.checked; };

  $('#aspect').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    $$('#aspect button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    state.aspect = b.dataset.v;
    applyAspect();
    render(state.pausedMs);
    updateExportUI();
  });
  $('#bgSwatches').addEventListener('click', e=>{
    const b = e.target.closest('.sw'); if(!b) return;
    selectBg(b.dataset.v);
  });
  $('#bgSwatches').addEventListener('input', e=>{
    if(e.target.type !== 'color') return;
    state.bgCustom = e.target.value;
    selectBg('custom');
  });
  $('#fit').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    $$('#fit button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    state.fit = b.dataset.v;
    render(state.pausedMs);
  });

  window.addEventListener('keydown', e=>{
    if(e.target.matches('input,textarea')) return;
    if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
    if(e.key==='r' || e.key==='R'){ restart(); }
  });

  // Paste images/videos from clipboard (Cmd/Ctrl+V from anywhere — screenshot,
  // browser, Finder) — they get ingested like a regular file drop.
  document.addEventListener('paste', async (e) => {
    if(e.target.matches('input,textarea')) return;
    const items = e.clipboardData && e.clipboardData.items;
    if(!items || !items.length) return;
    const files = [];
    for(const item of items){
      if(item.kind === 'file' && /^(image|video)\//.test(item.type)){
        const f = item.getAsFile();
        if(f) files.push(f);
      }
    }
    if(!files.length) return;
    e.preventDefault();
    setStatus(`Pasting ${files.length} item${files.length>1?'s':''}…`);
    await ingestFiles(files);
    audio.play('pop');
  });

  // Cmd/Ctrl+C copies the current canvas frame to the clipboard as PNG, so
  // users can paste it into other apps.
  document.addEventListener('copy', async (e) => {
    if(e.target.matches('input,textarea')) return;
    const sel = window.getSelection();
    if(sel && sel.toString().length > 0) return;
    if(!navigator.clipboard || !window.ClipboardItem) return;
    try {
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      if(!blob) return;
      e.preventDefault();
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      setStatus('Frame copied to clipboard');
      audio.play('click');
      setTimeout(() => setStatus('', false), 1200);
    } catch(err){
      console.warn('Copy failed:', err);
      setStatus('Copy failed — canvas may be tainted by a non-CORS image');
      setTimeout(() => setStatus('', false), 1800);
    }
  });
}

/* ----------------------------- init ----------------------------- */
applyAspect();
renderEffects();
computeTotal();
render(0);
wire();
syncAllControls();
renderProjects();

// Inspiration: render and queue up 6 demo "designs" so the canvas isn't empty
// on first load. They auto-clear the moment the user drops their own files.
loadDemoClips();

/* ----------------------------- PWA: service worker ----------------------------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
</body>
</html>
